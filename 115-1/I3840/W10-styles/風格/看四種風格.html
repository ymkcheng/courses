<h1>四種風格，挑一種</h1>
<p>四種都是電鍋主管同一份七頁簡報，只是樣子不一樣，下面的小圖是第 1 頁。點名字開成整頁，點一下畫面再按右方向鍵，七頁一頁一頁看，看它一段一段出來。<br>挑一種告訴你的 AI，或說「風格 1 的顏色加風格 4 的電鍋」，請它混在一起。都不喜歡，就請它照手冊另外做三種。</p>
