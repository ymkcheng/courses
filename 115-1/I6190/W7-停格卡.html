<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>如果是你</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#EFE4CC;--card:#F7EFDD;--ink:#3A2E25;--soft:#6B5A49;--shadow:#D6C29C;--terra:#C8643B;--sage:#6F8F62}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;overflow:hidden}
body{background-image:radial-gradient(#CDBB94 0.7px,transparent 0.8px);background-size:7px 7px}
/* 2026-11-18 Kevin：影片可以再大一點，右邊小一點但不能太小 → 62:38 改 68:32，卡片留白與間距跟著縮 */
.stage{display:grid;grid-template-columns:68fr 32fr;gap:24px;height:100vh;padding:24px}
.left{display:flex;flex-direction:column;gap:14px;min-height:0;justify-content:center}
.video{border:1.5px solid var(--ink);border-radius:4px;background:#1d1a17;position:relative;box-shadow:5px 5px 0 var(--shadow);aspect-ratio:16/9;width:100%;max-height:calc(100vh - 56px - 180px)}
.credit{margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:#6b5a49}
.src a{color:inherit}.src{margin-top:-12px;text-align:right;font-size:12px;color:#6b5a49;opacity:.75}
.jump{display:flex;align-items:center;gap:4px;flex-wrap:nowrap}
.jump span{font:600 14px "Noto Sans TC",sans-serif;color:var(--soft);margin-right:4px;white-space:nowrap}
.jump button{font:600 14px "Noto Sans TC",sans-serif;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;padding:0}
.jump button:hover{background:#FBF5E8}
.jump button.now{background:var(--terra);border-color:var(--terra);color:#fff}
.rew{font:600 15px "Noto Sans TC",sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--ink);border-radius:18px;padding:5px 14px;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}
.rew:hover{background:#FBF5E8}
.sub{min-height:clamp(110px,17vh,150px);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 24px;background:#2B241E;color:#FBF3E2;border-radius:4px;box-shadow:5px 5px 0 var(--shadow);font-family:"Noto Sans TC",sans-serif;font-weight:500;font-size:clamp(30px,3.2vw,52px);line-height:1.35}
.still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:3;display:none;cursor:pointer;border-radius:3px}
.still.on{display:block}
.video iframe,#yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.catch{position:absolute;left:0;right:0;top:0;bottom:56px;cursor:pointer;z-index:2}
.panel{position:relative;cursor:pointer;user-select:none}
.card{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--ink);border-radius:4px;box-shadow:5px 5px 0 var(--shadow);padding:36px 30px;display:flex;flex-direction:column;justify-content:center;gap:22px;opacity:0;transform:translateY(24px) rotate(-1.2deg);transition:opacity .45s,transform .45s;pointer-events:none}
.card.on{opacity:1;transform:none}
.card::before{content:"";position:absolute;inset:10px;border:.5px solid var(--ink);border-radius:2px;pointer-events:none}
.big{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(56px,8vw,120px);line-height:1;color:var(--terra)}
.say{font-family:"Noto Serif TC",serif;font-weight:500;font-size:clamp(24px,2.25vw,38px);line-height:1.45}
.no{font-family:"Noto Serif TC",serif;font-weight:700;color:var(--ink);border-bottom:3px dotted var(--terra)}
.items{list-style:none;display:flex;flex-direction:column;gap:12px;font-size:clamp(20px,1.8vw,28px);color:var(--soft)}
.items li{display:flex;gap:12px;align-items:center}
.when{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(24px,2.3vw,36px);color:var(--terra);background:#FBF5E8;border:1px solid var(--terra);border-radius:3px;padding:6px 14px;align-self:flex-start}
.items b{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--ink);color:var(--card);font-weight:500;font-size:.8em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cell{background:#FBF5E8;border:1px solid var(--ink);border-radius:3px;box-shadow:3px 3px 0 var(--shadow);aspect-ratio:5/4;padding:8px 10px;font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(16px,1.4vw,22px)}
.cell.y{border:1.5px dashed var(--terra);color:#9A4423}
.grid.four{grid-template-columns:repeat(2,1fr)}
.tape{height:14px;border-radius:7px;background:var(--sage);background-image:radial-gradient(var(--card) 1.6px,transparent 1.8px);background-size:12px 14px;background-position:3px 0}
.go{font-size:clamp(18px,1.5vw,24px);color:var(--soft)}

.q{font-family:"Noto Serif TC",serif;font-weight:500;font-size:clamp(22px,2vw,34px);line-height:1.5;color:var(--soft);border-left:4px solid var(--sage);padding:4px 0 4px 16px}
.q small{display:block;font-family:"Noto Sans TC",sans-serif;font-size:.6em;letter-spacing:.08em;color:var(--sage);margin-bottom:4px}
.you{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(26px,2.5vw,42px);line-height:1.45}
.you b{color:var(--terra)}
.where{font-size:clamp(18px,1.5vw,24px);color:var(--soft)}
.where .no{font-size:1.1em}
.sheets{display:flex;gap:28px;justify-content:center}
.sheet{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.sheet figcaption{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(18px,1.5vw,24px)}
.g8{position:relative;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr);width:clamp(150px,11vw,210px);aspect-ratio:1/1.414;background:#FBF5E8;border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--shadow)}
.g8 .c{border:1px dashed #b9ad97;display:flex;align-items:flex-start;justify-content:flex-start;padding:4px 6px;font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(15px,1.2vw,20px)}
.g8.back .c:nth-child(8){color:var(--terra);align-items:flex-end;justify-content:flex-end;font-size:clamp(20px,1.7vw,28px)}
.free{position:relative;width:clamp(150px,11vw,210px);aspect-ratio:1/1.414;background:#FBF5E8;border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--shadow)}
.free span{position:absolute;border:2px solid var(--ink);border-radius:4px 10px 6px 12px/10px 4px 12px 6px;font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(12px,1vw,17px);padding:0 4px}
.free i{position:absolute;right:6%;bottom:2%;font-style:normal;color:var(--soft)}
.free .ring{position:absolute;left:50%;top:50%;width:78%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid var(--terra);border-radius:50%;display:grid;place-items:center;font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(22px,2vw,32px);color:var(--terra)}
.g8 .ring{position:absolute;left:50%;top:50%;width:78%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid var(--terra);border-radius:50%;background:#FBF5E8;display:grid;place-items:center;font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(22px,2vw,32px);color:var(--terra)}
</style>

function rewind(){
  if (!player || !player.getCurrentTime) return;
  const t = player.getCurrentTime();
  let j = STOPS.findIndex(s => s > t - 0.5);
  if (j < 0) j = STOPS.length;

  backTo = null; still.classList.remove('on');
  player.seekTo(start, true); player.playVideo();
}

closeBtn.addEventListener('click', e => { e.stopPropagation(); const x = window.parent.document.querySelector('#watchLayer .x, #fullv .x'); if (x) x.click(); });
/* 2026-11-18 Kevin：「如果他要看前幾段或者是後幾段那怎麼辦？」→ 1 到 10 每一站一顆，點第 n 站：從第 n−1 站停的地方播（第 1 站從開頭），播到第 n 站停。 */
function jumpTo(n){
  if (!player || !player.seekTo) return;
  const start = n > 1 ? STOPS[n - 2] : 18.0;
  backTo = null; still.classList.remove('on'); show(n - 1);
  player.seekTo(start, true); player.playVideo();
}
STOPS.forEach((_, i) => { const b = document.createElement('button'); b.textContent = i + 1; b.title = '從第 ' + i + ' 站播到第 ' + (i + 1) + ' 站'; if (i === 0) b.title = '從開頭播到第 1 站';
  b.addEventListener('click', e => { e.stopPropagation(); jumpTo(i + 1); }); document.getElementById('jump').appendChild(b); });
function resume(){ if (!player || !player.getPlayerState) return; if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo(); else player.playVideo(); }
panel.addEventListener('click', resume);
document.getElementById('catch').addEventListener('click', resume);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); const x = window.parent !== window && window.parent.document.querySelector('#watchLayer .x, #fullv .x'); if (x) x.click(); return; }
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); resume(); }
  if (e.key === 'ArrowRight') show(k + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); rewind(); }
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
