<!-- G4460 W9：坐在你旁邊的 AI 同學（Kevin 2026-11-15 的想法，「可以，做完整的」）。
     學生畫完 2036 之後，老師問「要不要看一下坐在你旁邊的那位 AI 同學，他剛剛畫了什麼？」。
     內容照 內容.md（v0.1）；AI 同學跟學生同樣的規矩：十六站只寫影片裡有的東西，2022 起用強森結尾的方法往後推，2036 取名字。
     每一站：中間放大畫、寫兩題的答案，同時在 A4 上自己的位置畫小的；音符照年代由左往右排，編號照影片。
     動畫用 GSAP 3.15（跟雨天大地圖同一份 lib），線條一筆一筆畫出來用 strokeDashoffset。
     圖全部自己畫，不截影片畫面（TED 授權 CC BY-NC-ND 不准改作）。
     操作：打開就自動一站一站畫（2026-11-18 Kevin：「打開來之後就慢慢地自動播放就好，就感覺他好像即時的在寫，不用我一直按空白鍵」），
     用 AI 自己的速度畫（2.5 倍速，每站停半秒多，約 45 秒畫完），最後整張留在畫面上；空白鍵或點一下＝暫停／繼續；→、Enter＝直接下一步；←＝上一步；0＝收起大卡片看整張。
     大地圖上收起來（Esc）會送「暫停」進來，再打開送「繼續」。 -->

/* ---------- 擺位置：音符平均排在譜上，圖與字輪流放在譜的上下四層 ---------- */
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const items = document.getElementById("items");
const notes = ITEMS.map((it, i) => it);   // 引用同一份
const N = ITEMS.length;                    // 21 格（含影片最後一句那一格）
const X0 = 110, X1 = 1490, step = (X1 - X0) / (N - 1);
const TIERS = [ { y: 150, up: true }, { y: 740, up: false }, { y: 365, up: true }, { y: 900, up: false } ];
const PITCH = [670, 650, 630, 640, 660, 620, 610, 640, 650, 630, 660, 620, 640, 650, 630, 660, 0, 640, 620, 610, 600];
let tierCount = 0;
ITEMS.forEach((it, i) => {
  const x = X0 + i * step;
  it.x = x;
  if (it.quote) return;
  const t = TIERS[tierCount++ % 4];
  const g = el("g", { class: "item", "data-i": i }, items);
  it.g = g;
  // 音符
  const ny = PITCH[i];
  const color = it.red ? "var(--red)" : "var(--pencil)";
  const nh = el("ellipse", { cx: x, cy: ny, rx: 13, ry: 9, transform: `rotate(-20 ${x} ${ny})`, fill: it.hollow ? "var(--paper)" : color, stroke: color, "stroke-width": it.hollow ? 3 : 0, class: "nh" }, g);
  el("path", { d: `M${x + 12} ${ny - 4} V${ny - 58}`, class: it.red ? "redl stem" : "ink stem" }, g);
  if (it.hollow) { const q = el("text", { x: x + 20, y: ny - 30, class: "t-mid t-pen qm" }, g); q.textContent = "?"; }
  // 圖與字的那一塊：寬 240，中心對齊音符，碰到紙邊就往內收
  const bx = Math.max(30, Math.min(1570 - 240, x - 120));
  const top = t.y;
  const artY = t.up ? top : top + 4;
  const ag = el("g", { transform: `translate(${bx + 30} ${artY}) scale(0.9)` , class: "art" }, g);
  drawArt(ag, it.art, true);
  const ty = artY + 132;
  const l1 = el("text", { x: bx + 4, y: ty, class: "t-lab" }, g); l1.textContent = `${it.no}　${it.name}`;
  const l2 = el("text", { x: bx + 4, y: ty + 26, class: "t-sm" }, g); l2.textContent = it.era;
  // 虛線接到音符
  const from = t.up ? ty + 36 : artY - 6;
  const to = t.up ? ny - 64 : ny + 14;
  el("path", { d: `M${x} ${from} V${to}`, class: "link" }, g);
});
// 年代刻度
const eras = document.getElementById("eras");
for (const k in ERA_MARKS) { const it = ITEMS[k]; const tx = el("text", { x: it.x, y: 712, class: "t-sm", "text-anchor": "middle" }, eras); tx.textContent = ERA_MARKS[k]; }
// 「影片講到這裡」那一條虛線放在第 16 站與 2022 中間
const cutX = ITEMS[16].x;
document.querySelector("#cut path").setAttribute("d", `M${cutX} 560 V700`);
el("text", { x: cutX, y: 548, class: "t-sm t-pen", "text-anchor": "middle" }, document.getElementById("cut")).textContent = "影片講到這裡";

function drawArt(parent, key, small) {
  const a = ART[key];
  (a.fade || []).forEach(d => el("path", { d, class: "ink fade" }, parent));
  (a.ink || []).forEach(d => el("path", { d, class: "ink" }, parent));
  (a.pen || []).forEach(d => el("path", { d, class: "pen" }, parent));
  (a.txt || []).forEach(([x, y, t]) => { const e = el("text", { x, y, "text-anchor": "middle", class: "arttxt", style: "font-size:15px;fill:var(--pen)" }, parent); e.textContent = t; });
}

/* ---------- 動畫 ---------- */
function prep(p) { const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len; }
document.querySelectorAll("#items path:not(.link), #cut path").forEach(p => { if (!p.closest("#cut")) prep(p); });
gsap.set("#head text, #eras text, #cut, #items text, #items .nh, #items .link, #quoteLine", { opacity: 0 });
gsap.set("#staff line", { attr: { x2: 60 } });

const card = document.getElementById("card");
function fillCard(it, i) {
  card.className = it.x < 800 ? "right" : "left";
  if (it.quote) {
    card.classList.add("quote");
    card.innerHTML = `<div class="no">影片最後一句</div><div class="no" style="font-weight:400">「你會在大家玩得最開心的地方找到未來」</div><div class="note">接下來，影片沒有了，我用他的方法自己往下畫</div>`;
    return;
  }
  card.innerHTML = `<div class="no">${it.no}　${it.name}${it.era === it.no ? "" : `<small>${it.era === "？" ? "影片沒說哪一年" : it.era}</small>`}</div>`;
  const s = el("svg", { viewBox: "-30 -12 260 140", preserveAspectRatio: "xMidYMid meet" }, card);
  drawArt(s, it.art, false);
  s.querySelectorAll("path").forEach(p => { p.style.strokeWidth = it.art === "organ" ? 2.2 : 2.6; prep(p); });
  it.q.forEach((q, k) => { const d = document.createElement("div"); d.className = "qa"; d.innerHTML = `<b>${q}</b>${it.a[k]}`; card.appendChild(d); });
  if (it.note) { const d = document.createElement("div"); d.className = "note"; d.textContent = it.note; card.appendChild(d); }
}
function drawPaths(tl, paths, total, pos) {
  if (!paths.length) return;
  const per = Math.max(0.18, total / paths.length);
  tl.to(paths, { strokeDashoffset: 0, duration: per, ease: "power1.inOut", stagger: per * 0.85 }, pos);
}
function itemStep(i) {
  const it = ITEMS[i];
  const tl = gsap.timeline();
  fillCard(it, i);
  tl.fromTo(card, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .35 });
  if (it.quote) {
    tl.fromTo("#card .no, #card .note", { opacity: 0 }, { opacity: 1, duration: .5, stagger: .6 });
    tl.to("#quoteLine", { opacity: 1, duration: .5 }, "<");
    return tl;
  }
  const big = [...card.querySelectorAll("svg path")];
  const bigFade = big.filter(p => p.classList.contains("fade")), bigRest = big.filter(p => !p.classList.contains("fade"));
  const g = it.g;
  const small = [...g.querySelectorAll(".art path")];
  const smallFade = small.filter(p => p.classList.contains("fade")), smallRest = small.filter(p => !p.classList.contains("fade"));
  gsap.set("#card .qa, #card .note", { opacity: 0 });
  tl.to(g.querySelector(".nh"), { opacity: 1, duration: .25 }, "<");
  tl.to(g.querySelector(".stem"), { strokeDashoffset: 0, duration: .3 }, "<");
  tl.to(g.querySelectorAll("text"), { opacity: 1, duration: .4 }, "<");
  if (bigFade.length) {
    drawPaths(tl, bigFade, 1.4, ">"); drawPaths(tl, smallFade, 1.4, "<");
    tl.to([...bigFade, ...smallFade], { opacity: .12, duration: .5 }, "+=.3");
  }
  drawPaths(tl, bigRest, Math.min(2.4, .35 * bigRest.length + .6), ">");
  drawPaths(tl, smallRest, Math.min(2.4, .35 * smallRest.length + .6), "<");
  tl.to(g.querySelector(".link"), { opacity: 1, duration: .3 }, "<");
  tl.fromTo([...card.querySelectorAll(".arttxt"), ...g.querySelectorAll(".arttxt")], { opacity: 0 }, { opacity: 1, duration: .3 });
  tl.fromTo("#card .qa", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: .45, stagger: .7 });
  if (it.note) tl.fromTo("#card .note", { opacity: 0 }, { opacity: 1, duration: .5 }, "+=.3");
  return tl;
}
const steps = [
  () => gsap.timeline().fromTo("#head text", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: .45, stagger: .3 }),
  () => { const tl = gsap.timeline();
          tl.to("#staff line", { attr: { x2: 1540 }, duration: 1.1, stagger: .1, ease: "power2.out" });
          tl.to("#eras text, #cut", { opacity: 1, duration: .4, stagger: .08 }, "-=.4"); return tl; },
  ...ITEMS.map((_, i) => () => itemStep(i)),
  () => gsap.timeline().to(card, { opacity: 0, duration: .4 }),   // 最後：收起大卡片，看整張
];
let k = 0, cur = null;
/* ---------- 自動播：每一步畫完停一下再畫下一步 ---------- */
/* 2026-11-18 Kevin：「這樣太久了，而且沒有必要讓 AI 同學配合人類，就用你覺得他該有的速度，
   但我們假裝可以稍微慢一點讓人類看，但人類一看都覺得他的速度超快」→ 筆畫 2.5 倍速，每站只停半秒多，21 格約 45 秒 */
gsap.globalTimeline.timeScale(2.5);
// 保險：疊在大地圖裡的時候，瀏覽器有時不給這一頁畫面更新（requestAnimationFrame 停住），動畫就卡在原地。
// 每 50 毫秒看一次，動畫一格都沒走就自己推一格；平常有畫面更新時不會插手。
let 上一格 = -1;
setInterval(() => { if (gsap.ticker.frame === 上一格) gsap.ticker.tick(); 上一格 = gsap.ticker.frame; }, 50);
let 自動 = true, 等 = null;
const 標 = document.createElement("div");
標.style.cssText = "position:fixed;right:14px;bottom:10px;font:600 14px 'Noto Sans TC',sans-serif;color:#3a2e25;background:rgba(251,250,245,.85);border:1px solid #bbb;border-radius:14px;padding:3px 12px;opacity:.6;pointer-events:none";
document.body.appendChild(標);
function 更新標() { 標.textContent = k >= steps.length ? "畫完了" : 自動 ? "自動播放中（空白鍵暫停）" : "暫停中（空白鍵繼續）"; }
function 停留秒(i) {   // i：剛畫完的那一步
  if (i < 2) return 0.3;                 // 標題、五線譜
  const it = ITEMS[i - 2];
  if (!it) return 0;
  if (it.quote) return 1.2;
  return 0.6 + (it.note ? 0.4 : 0);      // AI 的速度：剛好看得到它寫了什麼，來不及讀完
}
function 排下一步() {
  clearTimeout(等); 更新標();
  if (!自動 || k >= steps.length) return;
  const i = k - 1;
  等 = setTimeout(() => { if (自動 && !(cur && cur.isActive())) next(); }, 停留秒(i) * 1000);
}
function 設自動(on) {
  自動 = on; clearTimeout(等);
  if (cur) cur.paused(!on);
  if (on && !(cur && cur.isActive())) 排下一步();
  更新標();
}
window.addEventListener("message", e => { if (e.data === "AI同學:暫停") 設自動(false); if (e.data === "AI同學:繼續") 設自動(true); });
function finish() { if (cur) cur.progress(1); }
function next() {
  if (cur && cur.isActive()) { cur.progress(1); return; }
  if (k >= steps.length) return;
  if (k >= 3) gsap.to(card, { opacity: 0, duration: .2 });   // 換下一站之前先把上一張大卡片收掉
  cur = steps[k++]();
  cur.eventCallback("onComplete", 排下一步); 更新標();
}
function prev() {   // 回到上一站：重新整理到那一步，前面的都直接畫完
  const target = Math.max(1, k - 1);
  location.hash = "#" + target; location.reload();
}
function jumpTo(n) { while (k < n) { finish(); cur = steps[k++](); } finish(); }
document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); 設自動(!自動); }
  else if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); if (cur) cur.paused(false); next(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
  else if (e.key === "0") { finish(); gsap.to(card, { opacity: card.style.opacity === "0" ? 1 : 0, duration: .25 }); }
});
document.addEventListener("click", () => 設自動(!自動));
const start = parseInt((location.hash || "").slice(1), 10);
if (start > 1) { jumpTo(start); history.replaceState(null, "", location.pathname); 排下一步(); } else next();
</script>
</body>
