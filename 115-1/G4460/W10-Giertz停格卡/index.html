const cards = [
  `<div class="tape"></div><div class="say">一張空白 A4，不用折<br>影片停下來，就換你</div><div class="sheets"><figure class="sheet"><div class="free">${[[6,5,40,22],[52,4,42,18],[8,30,30,20],[42,26,26,24],[72,28,22,16],[6,54,46,18],[56,52,38,22],[10,76,34,18],[48,78,24,16],[76,78,18,16]].map((b,i)=>`<span style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%;transform:rotate(${(i%3-1)*2}deg)">${i+1}</span>`).join('')}<i>⋯</i></div><figcaption>正面：自己畫框，標號碼</figcaption></figure><figure class="sheet"><div class="free"><div class="ring">${STOPS.length}</div></div><figcaption>背面：最後一站</figcaption></figure></div><div class="go">第 1 到 ${STOPS.length-1} 站寫正面，框的大小、位置你決定；第 ${STOPS.length} 站寫背面正中間的大圓</div>`
];
CARDS.forEach((c, i) => cards.push(`<div class="q"><small>她剛說</small>${c[0]}</div><div class="you"><b>換你：</b>${c[1]}</div><div class="where">${cell(i+1)}</div>`));
cards.push(`<div class="tape" style="background-color:var(--terra)"></div><div class="say">影片講完了</div>`);
const panel = document.getElementById('panel');
cards.forEach(html => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = html; panel.appendChild(d); });
const els = [...panel.children];
let k = 0;
function show(i){ k = Math.max(0, Math.min(els.length - 1, i)); els.forEach((e, j) => e.classList.toggle('on', j === k)); document.querySelectorAll('#jump button').forEach((b, j) => b.classList.toggle('now', j + 1 === k)); }
show(0);

/* 2026-11-18 Kevin「試著拿掉」：影片停住時 YouTube 會蓋上播放鍵、標題、更多影片，擋住學生要畫的畫面。
   停住時在影片上面蓋一張那一格的截圖（停點/01.jpg～16.jpg，720p，從影片抽的同一個時間），一播放就收起來；片尾蓋 Giertz 最後那一格，擋掉推薦影片。 */
const still = document.getElementById('still');
function cover(src){ /* 公開版不蓋截圖（TED 條款不准分享片段） */ }
still.addEventListener('click', () => resume());
// 截圖先載進來，停的那一刻才不會空一下
/* 公開版沒有截圖，不預載 */
let player = null, next = 0, backTo = null;   // backTo：停下來之後要退回的那一格，等真的暫停了才退，退了也還是停著
function resetNext(t){ next = STOPS.findIndex(s => s > t + 0.3); if (next < 0) next = STOPS.length; }
function onYouTubeIframeAPIReady(){
  player = new YT.Player('yt', {
    videoId: VIDEO,
    playerVars: { cc_load_policy: 0, hl: 'zh-TW', rel: 0, modestbranding: 1, playsinline: 1 },
    events: {
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) { still.classList.remove('on'); resetNext(player.getCurrentTime()); try { player.setOption('captions', 'track', {}); player.unloadModule('captions'); } catch (err) {} }
        if (e.data === YT.PlayerState.PAUSED && backTo !== null) { const b = backTo; backTo = null; if (Math.abs(player.getCurrentTime() - b) > 0.05) player.seekTo(b, true); }
        if (e.data === YT.PlayerState.ENDED) { cover('停點/結束.jpg'); show(els.length - 1); }
      }
    }
  });
  const sub = document.getElementById('sub');
  setInterval(() => {
    if (!player || !player.getCurrentTime) return;
    const tt = player.getCurrentTime();
    const c = CUES.find(c => tt >= c[0] && tt < c[1] + 0.25);
    const txt = c ? c[2] : '';
    if (sub.textContent !== txt) sub.textContent = txt;
  }, 120);
  setInterval(() => {
    if (!player || !player.getPlayerState || player.getPlayerState() !== YT.PlayerState.PLAYING) return;
    const t = player.getCurrentTime();
    if (next < STOPS.length && t >= STOPS[next]) { backTo = STOPS[next]; player.pauseVideo(); cover('停點/' + String(next + 1).padStart(2, '0') + '.jpg'); show(next + 1); next++; }
  }, 150);
}
/* 老師按（點停格卡、點影片、按空白鍵或 Enter）只有一個意思：繼續播。正在播的時候按，什麼都不做；停只由程式到點自己停。 */
/* 2026-11-18 Kevin：「如果學生他跟我說可不可以倒帶，那這個時候就沒有這個功能了」。
   倒回這一段的開頭（上一站停的地方，第一站就倒回影片開頭），接著播，到這一站會再停一次。
   在一段開頭半秒內再按，就再往前一段，所以連按幾下可以倒回好幾站。 */
function rewind(){
  if (!player || !player.getCurrentTime) return;
  const t = player.getCurrentTime();
  let j = STOPS.findIndex(s => s > t - 0.5);
  if (j < 0) j = STOPS.length;
  const start = j > 0 ? STOPS[j - 1] : 12.0;
  backTo = null; still.classList.remove('on');
  player.seekTo(start, true); player.playVideo();
}
/* 2026-11-18 Kevin：有了 1～10 的數字鈕，「這一段重看」的鈕就不用了（← 鍵與簡報筆上一頁照舊是重看這一段）；
   「收起來」從大地圖疊上層的下方正中間搬到這裡，左下角。單獨打開這一頁（不是疊在大地圖上）就不顯示。 */
const closeBtn = document.getElementById('close');
if (window.parent === window) closeBtn.style.visibility = 'hidden';
closeBtn.addEventListener('click', e => { e.stopPropagation(); const x = window.parent.document.querySelector('#watchLayer .x'); if (x) x.click(); });
/* 2026-11-18 Kevin：「如果他要看前幾段或者是後幾段那怎麼辦？」→ 1 到 10 每一站一顆，點第 n 站：從第 n−1 站停的地方播（第 1 站從開頭），播到第 n 站停。 */
function jumpTo(n){
  if (!player || !player.seekTo) return;
  const start = n > 1 ? STOPS[n - 2] : 12.0;
  backTo = null; still.classList.remove('on'); show(n - 1);
  player.seekTo(start, true); player.playVideo();
}
STOPS.forEach((_, i) => { const b = document.createElement('button'); b.textContent = i + 1; b.title = '從第 ' + i + ' 站播到第 ' + (i + 1) + ' 站'; if (i === 0) b.title = '從開頭播到第 1 站';
  b.addEventListener('click', e => { e.stopPropagation(); jumpTo(i + 1); }); document.getElementById('jump').appendChild(b); });
function resume(){ if (!player || !player.getPlayerState) return; if (player.getPlayerState() !== YT.PlayerState.PLAYING) player.playVideo(); }
panel.addEventListener('click', resume);
document.getElementById('catch').addEventListener('click', resume);
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); resume(); }
  if (e.key === 'ArrowRight') show(k + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); rewind(); }
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
